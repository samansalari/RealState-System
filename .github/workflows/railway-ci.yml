name: Railway CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend
        working-directory: ./real-estate-frontend
        run: |
          npm install
      - name: Build frontend
        working-directory: ./real-estate-frontend
        run: |
          npm run build || true
      - name: Install backend
        working-directory: ./real-estate-backend
        run: |
          npm install
      - name: Build backend
        working-directory: ./real-estate-backend
        run: |
          npm run build || true
      - name: Create Railway deployments (stub)
        run: |
          echo "Railway deployment would be triggered here in CI if configured."
